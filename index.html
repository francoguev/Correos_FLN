<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correos de Onboarding · Fortalecernos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-fallback">FORTALECERNOS</div>
    </div>

    <div>
      <h2>Plantillas</h2>
      <div class="template-list" id="template-list"></div>
    </div>

    <div>
      <h2>Herramientas</h2>
      <button class="template-btn settings-btn" id="signatures-btn">
        <strong>✍️ Firma digital</strong>Generador de firma para correo
      </button>
    </div>

    <div>
      <h2>Configuración</h2>
      <button class="template-btn settings-btn" id="settings-btn">
        <strong>⚙️ Datos de la empresa</strong>Logo, Notion y contacto de RRHH
      </button>
    </div>

    <p class="sidebar-footer">Generador interno de correos y firmas. Los datos de empresa se guardan en este navegador.</p>
  </aside>

  <!-- MAIN (contenido dinámico, ver app.js) -->
  <main class="main" id="main-content"></main>

</div>

<div class="toast" id="toast"></div>

<script src="templates.js"></script>
<script src="signatures.js"></script>
<script src="app.js"></script>
</body>
</html>
